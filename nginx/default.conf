server {
    listen 80;
    listen [::]:80;
    server_name mahmoud-khlaif.com ://mahmoud-khlaif.com;

    # Certbot ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mahmoud-khlaif.com ://mahmoud-khlaif.com;

    index index.php index.html index.htm;
    root /var/www/html;

    # SSL Certificates (Certbot paths)
    ssl_certificate /etc/letsencrypt/live/://mahmoud-khlaif.com;
    ssl_certificate_key /etc/letsencrypt/live/://mahmoud-khlaif.com;

    # Hardening SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }
}


